name: mr17dom1-site
services:
  site:
    image: ${SITE_IMAGE:?Set SITE_IMAGE or use scripts/deploy.sh}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?Set the existing Traefik network}
      traefik.http.services.mr17dom1-site.loadbalancer.server.port: "80"
      traefik.http.routers.mr17dom1-site.rule: Host(`mr17dom1.ru`) || Host(`www.mr17dom1.ru`)
      traefik.http.routers.mr17dom1-site.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:?Set HTTPS entrypoint}
      traefik.http.routers.mr17dom1-site.tls: "true"
      traefik.http.routers.mr17dom1-site.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?Set existing ACME resolver}
      traefik.http.routers.mr17dom1-site.service: mr17dom1-site
      traefik.http.routers.mr17dom1-site-http.rule: Host(`mr17dom1.ru`) || Host(`www.mr17dom1.ru`)
      traefik.http.routers.mr17dom1-site-http.entrypoints: ${TRAEFIK_HTTP_ENTRYPOINT:?Set HTTP entrypoint}
      traefik.http.routers.mr17dom1-site-http.middlewares: mr17dom1-site-https
      traefik.http.routers.mr17dom1-site-http.service: mr17dom1-site
      traefik.http.middlewares.mr17dom1-site-https.redirectscheme.scheme: https
      traefik.http.middlewares.mr17dom1-site-https.redirectscheme.permanent: "true"
networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?Set the existing Traefik network}

